<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b14">
<meta name="referrer" content="no-referrer">
<title>Televisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=58">
</head>
<body class="tv">

<!-- ================= PANTALLA CATÁLOGO ================= -->
<section id="catalogScreen">

  <!-- Banda superior: favoritos, busqueda, luz de emision, herramientas -->
  <header class="band">
    <button id="btnHeaderFavs" class="btnBandFavs" aria-label="Mis Favoritos" title="Ver canales favoritos" tabindex="0">
      <span class="favBandIcon" aria-hidden="true">&#9733;</span>
      <span class="favBandText">Favoritos</span>
      <span id="favCountBadge" class="favBadge">0</span>
    </button>

    <button id="btnSearch" class="tally" aria-label="Buscar" tabindex="0">
      <span class="lamp" aria-hidden="true"></span>
      <span id="tallyText" class="tallyText">En directo</span>
    </button>

    <div class="onAir" aria-live="off" role="status">
      <span id="onAirList" class="onAirList">Catálogo de televisión</span>
    </div>

    <div class="bandRight">
      <div class="tools">
        <button id="btnSourceSelect" class="icon countryBtn" aria-label="Cambiar País o Lista" title="Cambiar País o Región" tabindex="0">&#127760;</button>
        <button id="btnOpenSearch" class="icon" aria-label="Buscar canales" title="Buscar" tabindex="0">&#128269;</button>
        <button id="tabCatalog" class="icon" aria-label="Catalogo" tabindex="0">&#9635;</button>
        <button id="tabGuide" class="icon" aria-label="Guia de TV" tabindex="0">&#9776;</button>
      </div>
      <div id="clock" class="clock"></div>
      <button id="langSelect" class="icon" aria-label="Idioma" tabindex="0">ES</button>
    </div>
  </header>

  <!-- Buscador desplegable -->
  <div id="searchPanel" class="searchPanel">
    <div class="searchRow">
      <input id="searchInput" class="search" type="text" placeholder="Buscar canales..."
             autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="searchCount" class="searchCount"></div>
      <button id="btnCloseSearch" class="searchCloseBtn" aria-label="Cerrar búsqueda" tabindex="0">&times;</button>
    </div>
  </div>

  <div class="layout">
    <main class="canvas">
      <!-- Estanterias de canales -->
      <div id="shelves" class="rows" tabindex="0"></div>
    </main>
  </div>
</section>

<!-- ================= GUIA ================= -->
<section id="guideScreen" style="display:none">
  <div id="epg" class="epg"></div>
</section>

<!-- ================= REPRODUCTOR ================= -->
<section id="playerScreen" style="display:none">
  <video id="video" playsinline webkit-playsinline controls></video>
  <div class="overlay">
    <div class="bar">
      <h1 id="nowTitle" class="nowTitle"></h1>
      <div id="playerStatus" class="status"></div>
    </div>
    <div id="quality" class="quality"></div>
    <div class="playerActions">
      <button id="btnBack" class="pbtn pbtn-back" aria-label="Volver a canales" title="Volver a canales" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9664;</span>
        <span class="pbtnText">Volver</span>
      </button>

      <button id="btnPrevChannel" class="pbtn pbtn-nav" aria-label="Canal anterior" title="Canal anterior" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9198;</span>
        <span class="pbtnText">Anterior</span>
      </button>

      <button id="btnStop" class="pbtn pbtn-danger" aria-label="Detener emisión" title="Detener emisión" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9632;</span>
        <span class="pbtnText">Detener</span>
      </button>

      <button id="btnNextChannel" class="pbtn pbtn-nav" aria-label="Canal siguiente" title="Canal siguiente" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9197;</span>
        <span class="pbtnText">Siguiente</span>
      </button>

      <button id="btnFav" class="pbtn pbtn-fav" aria-label="Añadir a favoritos" title="Favorito" tabindex="0">
        <span id="favPlayerIcon" class="pbtnIcon" aria-hidden="true">&#9734;</span>
        <span id="favPlayerText" class="pbtnText">Favorito</span>
      </button>

      <button id="btnReload" class="pbtn pbtn-reload" aria-label="Recargar emisión" title="Recargar emisión" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#128259;</span>
        <span class="pbtnText">Recargar</span>
      </button>

      <button id="btnMute" class="pbtn pbtn-mute" aria-label="Silenciar sonido" title="Sonido" tabindex="0">
        <span id="mutePlayerIcon" class="pbtnIcon" aria-hidden="true">&#128266;</span>
        <span id="mutePlayerText" class="pbtnText">Sonido</span>
      </button>

      <button id="btnPiP" class="pbtn pbtn-pip" aria-label="Picture in Picture" title="Ventana flotante" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9635;</span>
        <span class="pbtnText">PiP</span>
      </button>

      <button id="btnFullscreen" class="pbtn pbtn-fs" aria-label="Pantalla completa" title="Pantalla completa" tabindex="0">
        <span class="pbtnIcon" aria-hidden="true">&#9974;</span>
        <span class="pbtnText">Completa</span>
      </button>
    </div>
    <div id="playerStopped" class="stoppedMsg" style="display:none">
      <b>Emision detenida</b>
      <span>Pulsa OK para volver a reproducir este canal.</span>
    </div>
    <p class="hint">&#9664; &#9654; Calidad &middot; OK Reproducir y pausar &middot; BACK Volver a la lista</p>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="js/config.js?v=58"></script>
<script src="js/epg.js?v=58"></script>
<script src="js/player.js?v=58"></script>
<script src="js/app.js?v=58"></script>
</body>
</html>
