<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b14">
<meta name="referrer" content="no-referrer">
<title>Televisión</title>
<link rel="stylesheet" href="css/app.css?v=56">
</head>
<body class="tv">

<!-- ================= PANTALLA CATÁLOGO ================= -->
<section id="catalogScreen">

  <!-- Banda superior: lo único que se mueve (la luz de tally) + búsqueda permanente -->
  <header class="band">
    <button id="btnSearch" class="tally" aria-label="Buscar" tabindex="0">
      <span class="lamp" aria-hidden="true"></span>
      <span class="tallyText">En directo</span>
    </button>

    <div class="onAir" aria-live="off" role="status">
      <span id="onAirList" class="onAirList">Cargando guía...</span>
    </div>

    <div class="bandRight">
      <div class="tools">
        <button id="tabCatalog" class="icon" aria-label="Catalogo" tabindex="0">&#9635;</button>
        <button id="tabGuide" class="icon" aria-label="Guia de TV" tabindex="0">&#9776;</button>
      </div>
      <div id="clock" class="clock"></div>
      <button id="langSelect" class="icon" aria-label="Idioma" tabindex="0">ES</button>
    </div>
  </header>

  <!-- Buscador: siempre visible, nunca escondido -->
  <div id="searchPanel" class="searchPanel">
    <div class="searchRow">
      <input id="searchInput" class="search" type="text" placeholder="Buscar entre 11.262 canales"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="searchCount" class="searchCount"></div>
    </div>
    <div id="searchFilters" class="filters"></div>
  </div>

  <div class="layout">
    <aside id="categories" class="rail"></aside>

    <main class="canvas">
      <!-- Cartela destacado: bloque de emision principal -->
      <section id="hero" class="cardela" tabindex="0"></section>

      <!-- Estanterias de canales -->
      <div id="shelves" class="rows" tabindex="0"></div>
    </main>
  </div>
</section>

<!-- ================= GUIA ================= -->
<section id="guideScreen" style="display:none">
  <div id="epg" class="epg"></div>
</section>

<!-- ================= REPRODUCTOR ================= -->
<section id="playerScreen" style="display:none">
  <video id="video" playsinline webkit-playsinline controls></video>
  <div class="overlay">
    <div class="bar">
      <h1 id="nowTitle" class="nowTitle"></h1>
      <div id="playerStatus" class="status"></div>
    </div>
    <div id="quality" class="quality"></div>
    <div class="playerActions">
      <button id="btnStop" class="pbtn danger" aria-label="Detener emision" tabindex="0">Detener</button>
      <button id="btnBack" class="pbtn" aria-label="Volver a la lista" tabindex="0">Volver a la lista</button>
      <button id="btnPiP" class="pbtn" aria-label "Picture in Picture" tabindex="0">PiP</button>
    </div>
    <div id="playerStopped" class="stoppedMsg" style="display:none">
      <b>Emision detenida</b>
      <span>Pulsa OK para volver a reproducir este canal.</span>
    </div>
    <p class="hint">&#9664; &#9654; Calidad &middot; OK Reproducir y pausar &middot; BACK Volver a la lista</p>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="js/config.js?v=56"></script>
<script src="js/epg.js?v=56"></script>
<script src="js/player.js?v=56"></script>
<script src="js/app.js?v=56"></script>
</body>
</html>
